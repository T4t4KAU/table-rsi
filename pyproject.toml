[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tablersi"
version = "0.1.1"
description = "Frozen-weight tabular reasoning with guarded SQL search and audited policy updates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlglot==28.10.1",
    "requests==2.32.5",
    "numpy==2.2.6",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.17.3"]
report = ["matplotlib==3.10.8"]
download = ["modelscope==1.40.2"]

[project.scripts]
tablersi = "tablersi.cli:main"
tablersi-ask = "tablersi.ask:main"
tablersi-partition = "tablersi.partition:main"

[project.urls]
Repository = "https://github.com/T4t4KAU/table-rsi"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
