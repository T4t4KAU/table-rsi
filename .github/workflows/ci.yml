name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src scripts tests
      - name: Format
        run: ruff format --check --output-format concise src scripts tests
      - name: Tests
        run: python -m pytest tests -q
      - name: Command-line entry points
        run: |
          tablersi --help
          tablersi-ask --help
          tablersi-partition --help
      - name: Build package
        run: python -m pip wheel --no-deps --wheel-dir dist .
